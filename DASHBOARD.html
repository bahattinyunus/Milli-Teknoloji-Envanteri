<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>National Tech Inventory | Milli Teknoloji Envanteri</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #05070a;
            --card-bg: rgba(22, 27, 34, 0.7);
            --border: rgba(48, 54, 61, 0.5);
            --accent: #00d2ff;
            --accent-glow: rgba(0, 210, 255, 0.3);
            --text-primary: #e6edf3;
            --text-secondary: #8b949e;
            --success: #3fb950;
            --warning: #d29922;
            --glass: blur(10px);
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-dark);
            color: var(--text-primary);
            font-family: 'Outfit', sans-serif;
            margin: 0;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(0, 210, 255, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(139, 129, 249, 0.05) 0%, transparent 40%);
        }

        .header {
            padding: 40px 20px;
            text-align: center;
            background: rgba(13, 17, 23, 0.8);
            border-bottom: 1px solid var(--border);
            backdrop-filter: var(--glass);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            margin: 0;
            background: linear-gradient(90deg, #fff, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 4px;
        }

        .container { max-width: 1400px; margin: 40px auto; padding: 0 20px; }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 24px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            backdrop-filter: var(--glass);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), 0 0 16px var(--accent-glow);
            border-color: var(--accent);
        }

        .span-4 { grid-column: span 4; }
        .span-8 { grid-column: span 8; }
        .span-12 { grid-column: span 12; }

        .stat-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        .stat-item {
            background: rgba(255, 255, 255, 0.03);
            padding: 20px;
            border-radius: 12px;
            border-left: 4px solid var(--accent);
        }

        .stat-label { font-size: 0.8rem; color: var(--text-secondary); text-transform: uppercase; }
        .stat-value { font-size: 1.8rem; font-weight: 700; margin-top: 8px; color: #fff; font-family: 'Orbitron'; }

        /* Inventory Table Style */
        .table-container { overflow-x: auto; margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { padding: 16px; border-bottom: 2px solid var(--border); color: var(--accent); font-family: 'Orbitron'; font-size: 0.9rem; }
        td { padding: 16px; border-bottom: 1px solid var(--border); }
        tr:hover { background: rgba(255, 255, 255, 0.05); }

        .trl-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            background: rgba(63, 185, 80, 0.1);
            color: var(--success);
            border: 1px solid var(--success);
        }

        /* Swarm Visualizer */
        #swarmCanvas {
            width: 100%;
            height: 300px;
            background: #000;
            border-radius: 12px;
            margin-top: 15px;
        }

        .search-wrapper { position: relative; margin-bottom: 24px; }
        .search-input {
            width: 100%;
            padding: 14px 40px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 30px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }
        .search-input:focus { border-color: var(--accent); box-shadow: 0 0 10px var(--accent-glow); }

        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }
        .live-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: var(--success);
            border-radius: 50%;
            margin-right: 8px;
            box-shadow: 0 0 8px var(--success);
            animation: pulse 2s infinite;
        }
    </style>
</head>

    // Swarm Simulation (Boids)
    const canvas = document.getElementById('swarmCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = canvas.offsetWidth;
    canvas.height = canvas.offsetHeight;

    class Boid {
        constructor() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            this.vx = (Math.random() - 0.5) * 2;
            this.vy = (Math.random() - 0.5) * 2;
            this.size = 2;
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;

            if (this.x < 0) this.x = canvas.width;
            if (this.x > canvas.width) this.x = 0;
            if (this.y < 0) this.y = canvas.height;
            if (this.y > canvas.height) this.y = 0;
            
            // Subtle attraction to mouse
            // (Skipping for now to keep it clean)
        }

        draw() {
            ctx.fillStyle = '#00d2ff';
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
            
            // Connection lines
            boids.forEach(other => {
                const dist = Math.hypot(this.x - other.x, this.y - other.y);
                if (dist < 50) {
                    ctx.strokeStyle = `rgba(0, 210, 255, ${1 - dist/50})`;
                    ctx.lineWidth = 0.5;
                    ctx.beginPath();
                    ctx.moveTo(this.x, this.y);
                    ctx.lineTo(other.x, other.y);
                    ctx.stroke();
                }
            });
        }
    }

    const boids = Array.from({ length: 40 }, () => new Boid());

    function animate() {
        ctx.fillStyle = 'rgba(5, 7, 10, 0.2)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        boids.forEach(b => {
            b.update();
            b.draw();
        });
        requestAnimationFrame(animate);
    }
    animate();

                <td><span class="trl-badge">TRL ${p.trl}</span></td>
            </tr>
        `).join('');

        document.getElementById('totalAssets').innerText = data.length;
        const validTrls = data.filter(p => p.trl !== "N/A" && !isNaN(p.trl));
        const avg = validTrls.reduce((acc, curr) => acc + curr.trl, 0) / validTrls.length;
        document.getElementById('avgTrl').innerText = avg.toFixed(1);
    }

    function filterTable() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const filtered = inventoryData.filter(p => 
            p.name.toLowerCase().includes(query) || 
            p.company.toLowerCase().includes(query) || 
            p.dominion.toLowerCase().includes(query)
        );
        renderTable(filtered);
    }
